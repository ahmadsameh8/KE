[project]
name = "eu-competition-cases-kg"
version = "0.1.0"
description = "Natural-language Q&A and graph visualisation over a Neo4j knowledge graph of EU competition cases (LangChain + Gemini)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "langchain-google-genai>=4.2.2",
    "langchain-neo4j>=0.9.0",
    "matplotlib>=3.10.9",
    "neo4j>=6.2.0",
    "pandas>=3.0.3",
    "pyvis>=0.3.2",
    "seaborn>=0.13.2",
    "streamlit>=1.57.0",
]
